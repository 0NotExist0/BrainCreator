<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Brain Creator | Cloud Drive Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h2>Brain <span class="highlight">Creator</span></h2>
            </div>
            
            <div class="drive-integration">
                <button id="drive-connect" class="secondary-btn">Log-in con Google</button>
                <span id="drive-status">Stato: Disconnesso</span>
            </div>

            <hr class="separator">

            <div class="config-section">
                <div class="input-group">
                    <label>Nome del Cervello</label>
                    <input type="text" id="brain-name" placeholder="es. Brain-Alpha-9">
                </div>
                
                <div class="input-group">
                    <label>Tipo di Intelligenza</label>
                    <select id="brain-role">
                        <option value="assistant">Assistente Personale</option>
                        <option value="researcher">Ricercatore Scientifico</option>
                        <option value="creative">Scrittore Creativo</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Temperatura Neurale</label>
                    <input type="range" id="temp-slider" min="0" max="100" value="70">
                </div>
            </div>

            <div id="upload-progress" class="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="fill-bar"></div>
                </div>
                <span class="progress-text">Caricamento su Cloud...</span>
            </div>

            <button id="create-btn" class="primary-btn">Salva Cervello su Drive</button>
        </aside>

        <main class="main-content">
            <div class="canvas">
                <div class="status-monitor">
                    <div class="pulse-ring" id="main-ring"></div>
                    <h1 id="status-title">Sistema in Standby</h1>
                    <p id="status-desc">Connetti il tuo account Drive per iniziare la creazione.</p>
                </div>

                <div class="terminal">
                    <div class="terminal-header">Sistema Centrale v1.0.5</div>
                    <div id="log-output" class="log-content">
                        > Inizializzazione protocolli Google...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <script src="script.js"></script>
</body>
</html>
