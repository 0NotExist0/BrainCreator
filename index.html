<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Brain Creator | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Brain Config</h2>
            <div class="input-group">
                <label for="brain-name">Nome del Cervello</label>
                <input type="text" id="brain-name" placeholder="Es: Alpha-1...">
            </div>
            <div class="input-group">
                <label for="brain-role">Ruolo / Personalità</label>
                <select id="brain-role">
                    <option value="assistant">Assistente Analitico</option>
                    <option value="creative">Genio Creativo</option>
                    <option value="coder">Sviluppatore Esperto</option>
                </select>
            </div>
            <div class="input-group">
                <label for="temp-slider">Temperatura (Creatività)</label>
                <input type="range" id="temp-slider" min="0" max="100" value="70">
            </div>
            <button id="create-btn" class="primary-btn">Inizializza Cervello</button>
        </aside>

        <main class="main-content">
            <header>
                <h1>AI Brain <span class="highlight">Creator</span></h1>
                <p>Configura e addestra il tuo agente neurale personalizzato.</p>
            </header>

            <div class="canvas-area">
                <div id="brain-status" class="status-card">
                    <div class="pulse-ring"></div>
                    <p id="status-text">In attesa di configurazione...</p>
                </div>
                
                <div class="terminal">
                    <div class="terminal-header">Logs di Sistema</div>
                    <div id="log-output" class="log-content">
                        > Sistema pronto. Inserire parametri...
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
